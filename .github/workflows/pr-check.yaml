name: PR Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CC: gcc-13
      CXX: g++-13

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 13
        run: |
          if ! command -v g++-13 &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y g++-13
          fi

      - name: Setup gRPC
        uses: eWaterCycle/setup-grpc@v5
        with:
          grpc-version: 1.65.0

      - name: Symlink to /opt/grpc
        run: |
          sudo ln -s "$GRPC_ROOT" /opt/grpc

      - name: Create Build Directory
        run: mkdir -p build

      - name: Build Server
        run: make build-server

      - name: Build Client
        run: make build-client
